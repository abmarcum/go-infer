name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run Tests
        run: go test -v -race ./...
        if: matrix.os != 'windows-latest'

      - name: Run Tests (Windows)
        run: go test -v ./...
        if: matrix.os == 'windows-latest'

      - name: Build All Commands
        run: |
          go build -v .
          go build -v ./cmd/bench
          go build -v ./cmd/quantize
          go build -v ./cmd/package
