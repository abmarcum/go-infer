name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: false

      - name: Compile Metal Shaders (macOS)
        if: runner.os == 'macOS'
        run: |
          if command -v xcrun >/dev/null 2>&1; then
            echo "Compiling Metal kernels..."
            xcrun -sdk macosx metal -O3 -c pkg/metal/kernels.metal -o pkg/metal/kernels.air
            xcrun -sdk macosx metallib pkg/metal/kernels.air -o pkg/metal/kernels.metallib
            rm -f pkg/metal/kernels.air
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...
        if: matrix.os != 'windows-latest'

      - name: Run Tests (Windows)
        run: go test -v ./...
        if: matrix.os == 'windows-latest'

      - name: Build All Commands
        run: |
          go build -v .
          go build -v ./cmd/bench
          go build -v ./cmd/quantize
          go build -v ./cmd/package
