# ==============================================================================
# GoInfer Service Configuration File
# Location: /etc/goinfer/goinfer.conf
# ==============================================================================

# Path to the GGUF model file or Ollama model blob
GOINFER_MODEL_PATH="/var/lib/goinfer/models/default.gguf"

# Server HTTP Listen Port / Address
GOINFER_LISTEN_ADDR=":8080"

# KV-cache storage precision: f32, q8_0, q4_0 (4x RAM reduction)
GOINFER_KV_TYPE="q4_0"

# CORS Origin for Web UI and API clients
GOINFER_CORS_ORIGIN="*"

# Extra CLI flags (e.g. --temp 0.7 --top-p 0.9 --dist-mode none)
GOINFER_EXTRA_ARGS=""
